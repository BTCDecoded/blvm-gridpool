[package]
name = "blvm-gridpool"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Bitcoin Commons Contributors"]
description = "GridPool consensus-22 library pinned to boot-protocol develop be0f0b16"
license = "MIT"
publish = false

[features]
default = []
module = [
    "dep:bincode",
    "dep:blvm-node",
    "dep:blvm-sdk",
    "dep:blvm-sdk-macros",
    "dep:tokio",
    "dep:anyhow",
    "dep:async-trait",
    "dep:tracing",
    "dep:toml",
    "dep:hex",
]

[[bin]]
name = "blvm-gridpool"
path = "src/bin/blvm-gridpool.rs"
required-features = ["module"]

[dependencies]
sha2 = "0.10"
num-bigint = "0.4"
num-traits = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = { version = "=1.3.3", optional = true }
blvm-node = { version = ">=0.1, <1", optional = true, features = ["sled"] }
blvm-sdk = { version = ">=0.1, <1", optional = true, default-features = false, features = ["node"] }
blvm-sdk-macros = { version = ">=0.1, <1", optional = true }
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "sync", "time"], optional = true }
anyhow = { version = "1.0", optional = true }
async-trait = { version = "0.1", optional = true }
tracing = { version = "0.1", optional = true }
toml = { version = "0.8", optional = true }
hex = { version = "0.4", optional = true }

[patch.crates-io]
blvm-node = { path = "../blvm-node" }
blvm-sdk = { path = "../blvm-sdk" }
blvm-protocol = { path = "../blvm-protocol" }
blvm-consensus = { path = "../blvm-consensus" }
blvm-primitives = { path = "../blvm-primitives" }
blvm-spec-lock = { path = "../blvm-spec-lock" }
blvm-muhash = { path = "../blvm-muhash" }
blvm-secp256k1 = { path = "../blvm-secp256k1" }
